# Configuration for kreo-extra-buttons.
#
# Assign each custom button to any evdev BTN_* or KEY_* code. After
# editing, apply the change with: sudo systemctl restart kreo-extra-buttons
#
# See the full list of valid names with:
#   python3 -c "from evdev import ecodes; print('\n'.join(sorted(n for n in ecodes.ecodes if n.startswith(('BTN_','KEY_')))))"
#
# Common choices: BTN_SIDE, BTN_EXTRA, BTN_FORWARD, BTN_BACK, BTN_TASK,
# KEY_VOLUMEUP, KEY_VOLUMEDOWN, KEY_MUTE, KEY_PLAYPAUSE, KEY_NEXTSONG,
# KEY_PREVIOUSSONG, KEY_COPY, KEY_PASTE, KEY_CALC

button1=BTN_SIDE
button2=BTN_EXTRA
